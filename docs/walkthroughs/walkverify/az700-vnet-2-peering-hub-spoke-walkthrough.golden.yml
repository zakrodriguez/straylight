lab: az700-vnet-2-peering-hub-spoke-walkthrough
profile: azure-only
parameters:
  az_cli_version: 2.88.0
normalizers:
  guid:
    pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
    placeholder: <GUID>
  pubip:
    pattern: \b(?!10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.|127\.)\d{1,3}(?:\.\d{1,3}){3}\b
    placeholder: <PUBIP>
steps:
- step: deploy-precheck
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz deployment group show --resource-group\
    \ $RG --name main \\\n  --query properties.provisioningState -o tsv\n# Expected:\
    \ Succeeded   (anything else: run azure/scripts/az700.sh deploy hub-spoke)"
  rc: 0
  expect:
  - Succeeded
  strict: false
  captured: 'Succeeded

    '
- step: no-peerings
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network vnet peering list --resource-group\
    \ $RG --vnet-name vnet-hub \\\n  --query \"length(@)\" -o tsv\n# Expected: 0"
  rc: 0
  expect:
  - ^0$
  strict: false
  captured: '0

    '
- step: no-peering-routes
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network nic show-effective-route-table\
    \ --resource-group $RG \\\n  --name nic-vm-spoke1 --query \\\n  \"length(value[?nextHopType=='VNetPeering'])\"\
    \ -o tsv\n# Expected: 0   (only system routes; the hub's 10.100.0.0/22 hits the\
    \ None route)"
  rc: 0
  expect:
  - ^0$
  strict: false
  captured: '0

    '
- step: one-way-peering
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network vnet peering create --resource-group\
    \ $RG --name hub-to-spoke1 \\\n  --vnet-name vnet-hub --remote-vnet vnet-spoke1\
    \ \\\n  --allow-vnet-access --allow-forwarded-traffic -o none\naz network vnet\
    \ peering show --resource-group $RG --vnet-name vnet-hub \\\n  --name hub-to-spoke1\
    \ --query peeringState -o tsv\n# Expected: Initiated"
  rc: 0
  expect:
  - Initiated
  strict: false
  captured: 'Initiated

    '
- step: complete-spoke1
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network vnet peering create --resource-group\
    \ $RG --name spoke1-to-hub \\\n  --vnet-name vnet-spoke1 --remote-vnet vnet-hub\
    \ \\\n  --allow-vnet-access --allow-forwarded-traffic -o none\naz network vnet\
    \ peering show --resource-group $RG --vnet-name vnet-hub \\\n  --name hub-to-spoke1\
    \ --query peeringState -o tsv\n# Expected: Connected"
  rc: 0
  expect:
  - Connected
  strict: false
  captured: 'Connected

    '
- step: peer-spoke2
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network vnet peering create --resource-group\
    \ $RG --name hub-to-spoke2 \\\n  --vnet-name vnet-hub --remote-vnet vnet-spoke2\
    \ \\\n  --allow-vnet-access --allow-forwarded-traffic -o none\naz network vnet\
    \ peering create --resource-group $RG --name spoke2-to-hub \\\n  --vnet-name vnet-spoke2\
    \ --remote-vnet vnet-hub \\\n  --allow-vnet-access --allow-forwarded-traffic -o\
    \ none\naz network vnet peering show --resource-group $RG --vnet-name vnet-hub\
    \ \\\n  --name hub-to-spoke2 --query peeringState -o tsv\n# Expected: Connected"
  rc: 0
  expect:
  - Connected
  strict: false
  captured: 'Connected

    '
- step: route-to-hub
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network nic show-effective-route-table\
    \ --resource-group $RG \\\n  --name nic-vm-spoke1 --query \\\n  \"length(value[?nextHopType=='VNetPeering'\
    \ && addressPrefix[0]=='10.100.0.0/22'])\" \\\n  -o tsv\n# Expected: 1   (the\
    \ hub's whole address space, one peering route)"
  rc: 0
  expect:
  - ^1$
  strict: false
  captured: '1

    '
- step: no-route-to-spoke2
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network nic show-effective-route-table\
    \ --resource-group $RG \\\n  --name nic-vm-spoke1 --query \\\n  \"length(value[?nextHopType=='VNetPeering'\
    \ && addressPrefix[0]=='10.102.0.0/24'])\" \\\n  -o tsv\n# Expected: 0   (no route\
    \ to spoke2 \u2014 peering is non-transitive)"
  rc: 0
  expect:
  - ^0$
  strict: false
  captured: '0

    '
- step: peer-spokes-direct
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network vnet peering create --resource-group\
    \ $RG --name spoke1-to-spoke2 \\\n  --vnet-name vnet-spoke1 --remote-vnet vnet-spoke2\
    \ --allow-vnet-access -o none\naz network vnet peering create --resource-group\
    \ $RG --name spoke2-to-spoke1 \\\n  --vnet-name vnet-spoke2 --remote-vnet vnet-spoke1\
    \ --allow-vnet-access -o none\naz network vnet peering show --resource-group $RG\
    \ --vnet-name vnet-spoke1 \\\n  --name spoke1-to-spoke2 --query peeringState -o\
    \ tsv\n# Expected: Connected"
  rc: 0
  expect:
  - Connected
  strict: false
  captured: 'Connected

    '
- step: route-to-spoke2
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network nic show-effective-route-table\
    \ --resource-group $RG \\\n  --name nic-vm-spoke1 --query \\\n  \"length(value[?nextHopType=='VNetPeering'\
    \ && addressPrefix[0]=='10.102.0.0/24'])\" \\\n  -o tsv\n# Expected: 1   (direct\
    \ peering programs the route transit never would)"
  rc: 0
  expect:
  - ^1$
  strict: false
  captured: '1

    '
- step: gateway-transit-flag
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network vnet peering show --resource-group\
    \ $RG --vnet-name vnet-hub \\\n  --name hub-to-spoke1 --query allowGatewayTransit\
    \ -o tsv\n# Expected: false"
  rc: 0
  expect:
  - 'false'
  strict: false
  captured: 'false

    '
- step: teardown
  host: lab
  command: 'azure/scripts/az700.sh destroy hub-spoke

    # Expected: "delete submitted for rg-straylight-az700-hub-spoke (async)"'
  rc: 0
  expect:
  - delete submitted
  strict: false
  captured: 'delete submitted for rg-straylight-az700-hub-spoke (async); confirm later
    with: az700.sh list

    '
