lab: az700-hybrid-3-bgp-over-vpn-walkthrough
profile: az700-hybrid
parameters: {}
normalizers:
  guid:
    pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
    placeholder: <GUID>
  pubip:
    pattern: \b(?!10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.|127\.|169\.254\.)\d{1,3}(?:\.\d{1,3}){3}\b
    placeholder: <PUBIP>
steps:
- step: gateway-bgp-identity
  host: lab
  command: "RG=rg-straylight-az700-hybrid-vpn\naz network vnet-gateway show --resource-group\
    \ $RG --name vpngw-hub \\\n  --query \"{asn:bgpSettings.asn, peerWeight:bgpSettings.peerWeight,\
    \ bgpPeerIps:bgpSettings.bgpPeeringAddresses[0].defaultBgpIpAddresses}\" -o json\n\
    # Expected: asn 65515, and a default BGP peering IP inside the\n#           GatewaySubnet\
    \ (e.g. 10.100.0.30)"
  rc: 0
  expect:
  - '65515'
  strict: false
  captured: "{\n  \"asn\": 65515,\n  \"bgpPeerIps\": [\n    \"10.100.0.30\"\n  ],\n\
    \  \"peerWeight\": 0\n}"
- step: frr-configured
  host: lab
  command: "cd vagrant && VAGRANT_DOTFILE_PATH=.vagrant-az700-hybrid LAB_PROFILE=az700-hybrid\
    \ \\\n  vagrant ssh vpn1 -c \"sudo vtysh -c 'show running-config' | grep -E 'router\
    \ bgp|remote-as|network 192'\" 2>/dev/null\n# Expected: router bgp 65050 / neighbor\
    \ <gw> remote-as 65515 / network 192.168.56.0/21"
  rc: 0
  expect:
  - remote-as 65515
  strict: false
  captured: "router bgp 65050\n neighbor 10.100.0.30 remote-as 65515\n  network 192.168.56.0/21"
- step: bgp-established
  host: lab
  command: "cd vagrant && VAGRANT_DOTFILE_PATH=.vagrant-az700-hybrid LAB_PROFILE=az700-hybrid\
    \ \\\n  vagrant ssh vpn1 -c \"sudo vtysh -c 'show bgp summary' | grep -A2 Neighbor\"\
    \ 2>/dev/null\n# Expected: the gateway neighbor line (AS 65515), State/PfxRcd\
    \ showing an\n#           established session (a number, not Active/Connect/Idle)"
  rc: 0
  expect:
  - '65515'
  strict: false
  captured: 'Neighbor        V         AS   MsgRcvd   MsgSent   TblVer  InQ OutQ  Up/Down
    State/PfxRcd   PfxSnt Desc

    10.100.0.30     4      65515         8         8        0    0    0 00:04:55            1        1
    N/A'
- step: learned-routes
  host: lab
  command: "cd vagrant && VAGRANT_DOTFILE_PATH=.vagrant-az700-hybrid LAB_PROFILE=az700-hybrid\
    \ \\\n  vagrant ssh vpn1 -c \"sudo vtysh -c 'show bgp ipv4 unicast' | grep -E\
    \ '10.100|192.168.56'\" 2>/dev/null\n# Expected:\n#   10.100.0.0/22   10.100.0.30\
    \ ... 65515 i   <- learned from Azure via BGP\n#   192.168.56.0/21 0.0.0.0 ...\
    \       32768 i   <- originated toward Azure"
  rc: 0
  expect:
  - 10\.100
  strict: false
  captured: '   10.100.0.0/22    10.100.0.30                            0 65515 i

    *> 192.168.56.0/21  <PUBIP>                  0         32768 i'
- step: teardown
  host: lab
  command: 'azure/scripts/az700.sh destroy hybrid-vpn

    # Expected: "delete submitted for rg-straylight-az700-hybrid-vpn (async)"'
  rc: 0
  expect:
  - delete submitted
  strict: false
  captured: 'delete submitted for rg-straylight-az700-hybrid-vpn (async); confirm
    later with: az700.sh list'
