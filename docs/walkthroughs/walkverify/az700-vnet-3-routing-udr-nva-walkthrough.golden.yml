lab: az700-vnet-3-routing-udr-nva-walkthrough
profile: azure-only
parameters:
  az_cli_version: 2.88.0
normalizers:
  guid:
    pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
    placeholder: <GUID>
  pubip:
    pattern: \b(?!10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.|127\.)\d{1,3}(?:\.\d{1,3}){3}\b
    placeholder: <PUBIP>
steps:
- step: deploy-precheck
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz deployment group show --resource-group\
    \ $RG --name main \\\n  --query properties.provisioningState -o tsv\n# Expected:\
    \ Succeeded   (anything else: run azure/scripts/az700.sh deploy hub-spoke)"
  rc: 0
  expect:
  - Succeeded
  strict: false
  captured: 'Succeeded

    '
- step: default-internet-route
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network nic show-effective-route-table\
    \ --resource-group $RG \\\n  --name nic-vm-spoke1 \\\n  --query \"length(value[?source=='Default'\
    \ && nextHopType=='Internet'])\" -o tsv\n# Expected: 1   (exactly one system route\
    \ sends 0.0.0.0/0 to Internet)"
  rc: 0
  expect:
  - ^1$
  strict: false
  captured: '1

    '
- step: create-nva
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz vm create --resource-group $RG --name\
    \ vm-nva1 --image Ubuntu2404 \\\n  --size Standard_B2ts_v2 --vnet-name vnet-spoke1\
    \ --subnet snet-workload \\\n  --public-ip-address \"\" --nsg \"\" --admin-username\
    \ azureuser \\\n  --generate-ssh-keys --query powerState -o tsv\n# Expected: VM\
    \ running"
  rc: 0
  expect:
  - VM running
  strict: false
  captured: 'VM running

    WARNING: Consider upgrading security for your workloads using Azure Trusted Launch
    VMs. To know more about Trusted Launch, please visit https://aka.ms/TrustedLaunch.

    '
- step: enable-ip-forwarding
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network nic update --resource-group\
    \ $RG --name vm-nva1VMNic \\\n  --ip-forwarding true --query enableIPForwarding\
    \ -o tsv\n# Expected: true"
  rc: 0
  expect:
  - 'true'
  strict: false
  captured: 'true

    '
- step: create-route-table
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network route-table create --resource-group\
    \ $RG --name rt-spoke1 \\\n  --query provisioningState -o tsv\n# Expected: Succeeded"
  rc: 0
  expect:
  - Succeeded
  strict: false
  captured: 'Succeeded

    '
- step: create-udr
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\nNVAIP=$(az vm list-ip-addresses --resource-group\
    \ $RG --name vm-nva1 \\\n  --query \"[0].virtualMachine.network.privateIpAddresses[0]\"\
    \ -o tsv)\naz network route-table route create --resource-group $RG \\\n  --route-table-name\
    \ rt-spoke1 --name to-spoke2-via-nva \\\n  --address-prefix 10.102.0.0/24 --next-hop-type\
    \ VirtualAppliance \\\n  --next-hop-ip-address $NVAIP --query provisioningState\
    \ -o tsv\n# Expected: Succeeded"
  rc: 0
  expect:
  - Succeeded
  strict: false
  captured: 'Succeeded

    '
- step: associate-route-table
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network vnet subnet update --resource-group\
    \ $RG --vnet-name vnet-spoke1 \\\n  --name snet-workload --route-table rt-spoke1\
    \ \\\n  --query routeTable.id -o tsv\n# Expected: .../routeTables/rt-spoke1"
  rc: 0
  expect:
  - rt-spoke1
  strict: false
  captured: '/subscriptions/<GUID>/resourceGroups/rg-straylight-az700-hub-spoke/providers/Microsoft.Network/routeTables/rt-spoke1

    '
- step: effective-user-route
  host: lab
  command: "RG=rg-straylight-az700-hub-spoke\naz network nic show-effective-route-table\
    \ --resource-group $RG \\\n  --name nic-vm-spoke1 \\\n  --query \"length(value[?source=='User'\
    \ && nextHopType=='VirtualAppliance'])\" -o tsv\n# Expected: 1   (the UDR is live\
    \ on every NIC in the subnet, no reboot needed)"
  rc: 0
  expect:
  - ^1$
  strict: false
  captured: '1

    '
- step: teardown
  host: lab
  command: 'azure/scripts/az700.sh destroy hub-spoke

    # Expected: "delete submitted for rg-straylight-az700-hub-spoke (async)"'
  rc: 0
  expect:
  - delete submitted
  strict: false
  captured: 'delete submitted for rg-straylight-az700-hub-spoke (async); confirm later
    with: az700.sh list

    '
