---
# CipherIQ role: SHA-pinned source clones of cbom-generator, crypto-tracer
# (eBPF), and pqc-flow (passive sniffer) — three GPL-3 tools from CipherIQ
# for cryptographic inventory and monitoring. Clone-only by design
# (2026-07-26): none of the upstream repos has ever shipped a Dockerfile
# (verified across every commit on every branch), so the former
# stat/filter/compose machinery could never run and was removed. The repos
# build natively (CMake / Makefile); the clones serve as source material
# for the static CBOM scans and manual builds.

- name: Create CipherIQ directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/cipheriq
    - /opt/cipheriq/output

# Pinned to HEAD (HEAD as of 2026-05-26) — update via 'git ls-remote' when bumping
- name: Clone CipherIQ repositories
  ansible.builtin.git:
    repo: "https://github.com/CipherIQ/{{ item }}.git"
    dest: "/opt/cipheriq/{{ item }}"
    update: false
    version: "{{ {'cbom-generator': '884528070a2f447c11784c2f1bb953072dac30a5', 'crypto-tracer': 'a6fddf180714b2a11b2f75e356f5be9719809367', 'pqc-flow': '959913124d69f6b98910dafe462c267f3093b4cf'}[item] }}"
  loop:
    - cbom-generator
    - crypto-tracer
    - pqc-flow
  ignore_errors: true
  register: cipheriq_clones

- name: Display CipherIQ clone status
  ansible.builtin.debug:
    msg: >-
      CipherIQ source clones:
      {{ cipheriq_clones.results | rejectattr('failed', 'equalto', true) | map(attribute='item') | join(', ') | default('none', true) }}.
      Failed: {{ cipheriq_clones.results | selectattr('failed', 'equalto', true) | map(attribute='item') | join(', ') | default('none', true) }}.
